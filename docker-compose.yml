services:
  postgres:
    image: postgres:17-alpine
    container_name: madart-postgres
    environment:
      POSTGRES_USER: madart
      POSTGRES_PASSWORD: madart
      POSTGRES_DB: madart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madart"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: madart-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: madart-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://madart:madart@postgres:5432/madart
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:5173,http://localhost:5174,http://localhost:5175}
    ports:
      - "4000:4000"
    profiles: ["full"]

volumes:
  pgdata:
