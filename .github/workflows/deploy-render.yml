# Triggers a Render deploy of the API on every push that touches backend code.
# Secret: RENDER_DEPLOY_HOOK (Render → madart-api → Settings → Deploy Hook).
name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/domain/**'
      - 'packages/types/**'
      - 'packages/database/**'
      - 'packages/hardware-adapters/**'
      - 'pnpm-lock.yaml'
      - 'render.yaml'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
